name: Fork nightly

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  source:
    if: github.repository == 'pachxl/t3code'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.source.outputs.build }}
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
      upstream: ${{ steps.source.outputs.upstream }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream nightly without replacing fork changes
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream=$(gh api 'repos/pingdotgg/t3code/releases?per_page=30' --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$")))][0].tag_name')
          [[ -n "$upstream" && "$upstream" != null ]]
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --quiet upstream "refs/tags/$upstream:refs/tags/$upstream"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$upstream"
          ref=$(git rev-parse HEAD)
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].body // ""')
          if [[ "$previous" == *"Upstream nightly: $upstream"* && "$previous" == *"Fork source: $ref"* ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:main
          raw=${upstream#v}
          version="${raw%.*}.$(( ${raw##*.} * 1000000 + GITHUB_RUN_NUMBER ))"
          echo 'build=true' >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

  linux-runtime:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-deps
      - name: Enable production Connect public configuration
        run: cp .env.example .env
      - name: Install browser and native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          (cd apps/web && vp exec playwright install --with-deps chromium --only-shell)
      - name: Check fork changes
        run: |
          vp fmt --check apps/web/src/hooks/useProjectTheme.ts apps/web/src/hooks/useTheme.ts apps/web/src/hooks/useTheme.test.ts apps/web/src/hooks/useTheme.browser.test.tsx apps/web/src/components/settings/ProjectThemeSettings.tsx
          vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/web typecheck
          vp test run packages/contracts/src/settings.test.ts packages/shared/src/projectSettings.test.ts apps/web/src/hooks/useTheme.test.ts apps/web/src/hooks/useTheme.browser.test.tsx apps/web/src/components/settings/ProjectSettingsPanel.browser.test.tsx
      - name: Build production bundles and WSL runtime
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          vp run build:desktop
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p apps/server/dist/resource-monitor
          cp native/resource-monitor/target/release/t3-resource-monitor apps/server/dist/resource-monitor/
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$APP_VERSION" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$APP_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-wsl-runtime
          path: release-cli/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  windows:
    needs: [source, linux-runtime]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.source.outputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.ref }}
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install Spectre libraries required by Windows native dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'Visual Studio C++ tools are missing' }
          $setup = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
          $result = Start-Process $setup -ArgumentList @('modify', '--installPath', "`"$install`"", '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart', '--nocache') -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -notin 0,3010) { throw "Visual Studio setup failed: $($result.ExitCode)" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-wsl-runtime
          path: wsl-runtime
      - name: Enable production Connect public configuration
        shell: pwsh
        run: Copy-Item .env.example .env
      - name: Package Windows installer with fork updater
        shell: pwsh
        run: |
          $archive = (Get-ChildItem wsl-runtime/*.tar.gz).FullName
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version $env:APP_VERSION --output-dir release --wsl-runtime $archive --verbose
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish only a complete successful build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_NIGHTLY: ${{ needs.source.outputs.upstream }}
          FORK_SOURCE: ${{ needs.source.outputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @("release/T3-Code-$env:APP_VERSION-x64.exe", 'release/nightly.yml')
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Missing release artifact: $file" } }
          Get-ChildItem release/*.exe,release/*.blockmap,release/*.yml,wsl-runtime/*.tar.gz | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS.txt
          @("Windows x64 personal fork with project themes and upstream nightly updates.", '', "Upstream nightly: $env:UPSTREAM_NIGHTLY", "Fork source: $env:FORK_SOURCE", '', 'Uses the existing T3 home and production desktop profile. Local state and credentials are never uploaded.') | Set-Content release-notes.txt
          $assets = (Get-ChildItem release/*.exe,release/*.blockmap,release/*.yml,release/SHA256SUMS.txt,wsl-runtime/*.tar.gz).FullName
          gh release create "v$env:APP_VERSION" @assets --target $env:FORK_SOURCE --title "T3 Code fork $env:APP_VERSION" --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
